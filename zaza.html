<body class="dark-theme is-loading preset-graphite">

    <nav class="modern-nav glass-panel" aria-label="Primary navigation">

        </div>
        <div class="nav-actions">
            <button class="theme-switch" id="themeToggle" type="button" aria-label="Switch theme">
                <i data-lucide="sun" class="icon-sun" aria-hidden="true"></i>
                <i data-lucide="moon" class="icon-moon" aria-hidden="true"></i>
            </button>
        </div>
    </nav>
    <main class="smooth-scroll">

        <section class="page-hero">
            <p class="eyebrow">AI Assistant</p>
            <h1>دردش مع زعزع</h1>
            <p>مساعد Toji الذكي، بيتكلم مصري بس. اسأله عن شغل Toji أو دردش معاه في أي حاجة.</p>
        </section>
        <section class="page-body zaza-page-body">
            <div class="ai-chat-panel zaza-panel settled" id="zazaPanel" role="region" aria-label="Chat with Zaza, Toji's AI assistant">
                <div class="ai-chat-header">
                    <div class="ai-chat-header-info">
                        <span class="ai-chat-avatar-wrap">
                            <img class="ai-chat-avatar" src="assets/profile.webp" alt="زعزع" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'ai-chat-avatar ai-chat-avatar-fallback',textContent:'ز'}))">
                            <span class="ai-chat-avatar-dot" aria-hidden="true"></span>
                        </span>
                        <div>
                            <p class="ai-chat-title" id="botHeaderTitle">زعزع 🤖</p>
                            <p class="ai-chat-sub" id="botHeaderSub"><span class="ai-chat-online-dot" aria-hidden="true"></span>مساعد Toji الذكي 🇪🇬</p>
                        </div>
                    </div>
                    <div class="ai-chat-header-actions">
                        <a class="ai-chat-human-link" id="humanContactLink" href="#" target="_blank" rel="noopener noreferrer" title="تكلم مع Toji مباشرة" aria-label="Talk to Toji directly">
                            <i data-lucide="phone-call" aria-hidden="true"></i>
                        </a>
                        <button class="ai-chat-edit-name-btn" id="editNameBtn" type="button" title="غيّر اسمك عند زعزع" aria-label="Change your name">
                            <i data-lucide="pencil" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>
                <div class="ai-chat-messages" id="aiChatMessages"></div>
                <!-- quick-suggestion chips + mode/mood chips -->
                <div class="bot-choices" id="botChoices"></div>
                <!-- pending image preview before sending -->
                <div class="bot-image-preview" id="botImagePreview" hidden></div>
                <!-- free-text chat input -->
                <div class="bot-input-row" id="botInputRow">
                    <label class="bot-image-btn" id="botImageBtn" title="ابعت صورة (1 يوميًا)" aria-label="Attach an image">
                        <input type="file" id="botImageInput" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
                        <i data-lucide="image" aria-hidden="true"></i>
                    </label>
                    <input class="ai-chat-input" id="botInput" type="text" autocomplete="off" maxlength="300" dir="rtl" placeholder="اكتب سؤالك هنا...">
                    <button class="ai-chat-send" id="botInputSend" aria-label="Send">
                        <i data-lucide="send" aria-hidden="true"></i>
                    </button>
                </div>
            </div>
        </section>
    </main>
